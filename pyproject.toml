[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzing-campaigns"
version = "0.1.0"
description = "Coverage-guided fuzz targets, seed corpora and dictionaries for in-repo Python parsers, with a pure-Python engine and Atheris harnesses."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6", "mypy>=1.11", "pip-audit>=2.7"]
# libFuzzer for Python; wheels exist for Linux and macOS only, so this runs in CI.
atheris = ["atheris==3.1.0"]

[project.scripts]
fuzzcamp = "fuzzing_campaigns.cli:main"
fuzzcamp-atheris = "fuzzing_campaigns.atheris_harness:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fuzzing_campaigns = ["campaigns/*/*.dict", "campaigns/*/seeds/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
extend-exclude = [".tmp", ".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT", "RET", "PIE", "PERF", "BLE"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]
"src/fuzzing_campaigns/mutate.py" = ["S311"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["atheris"]
ignore_missing_imports = true
